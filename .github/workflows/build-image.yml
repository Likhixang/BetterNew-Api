name: Build & push BetterNew-Api image (GHCR)

on:
  push:
    branches:
      - main
      - likhixang/patch
      - patch/test
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve tag & write VERSION
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PUSH_LATEST=true
          else
            TAG="${GITHUB_REF#refs/heads/}"
            TAG="${TAG//\//-}"
            # 只有 main 与生产分支 likhixang/patch 更新 latest；测试分支只推专属 tag
            if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/likhixang/patch ]]; then
              PUSH_LATEST=true
            else
              PUSH_LATEST=false
            fi
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "PUSH_LATEST=${PUSH_LATEST}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # 固定 patch 版本号：镜像 tag 仍按分支区分，但版本显示统一为 patch1
          echo "patch1" > VERSION
          echo "Building tag: ${TAG} (push latest: ${PUSH_LATEST})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/likhixang/betternew-api

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/likhixang/betternew-api:${{ env.TAG }}
            ${{ env.PUSH_LATEST == 'true' && 'ghcr.io/likhixang/betternew-api:latest' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/likhixang/betternew-api:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
